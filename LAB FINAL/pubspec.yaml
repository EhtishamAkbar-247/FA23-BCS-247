name: movie_browser_app
description: "Abbasi Movie Center with Supabase Favorites"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.2

  # Networking
  http: ^1.2.0

  # To open YouTube links
  url_launcher: ^6.2.5

  # Database
  supabase_flutter: ^2.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package is used to encourage good coding practices.
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
